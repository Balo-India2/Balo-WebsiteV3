# cliff.toml — git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
# Template for the full changelog body (Tera syntax)
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} [**BREAKING**]{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`]({{ remote.link }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}\n
"""

# Remove the leading/trailing whitespace from the template
trim = true

# Changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Changelog footer
footer = ""

[git]
# Parse conventional commits
conventional_commits = true

# Filter out commits that don't follow the conventional commit format
filter_unconventional = true

# Process each line of a commit as a separate commit
split_commits = false

# Regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = false, group = "<!-- 7 -->Dependencies" },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
  { message = "^ci", group = "<!-- 9 -->CI/CD" },
  { message = "^revert", group = "<!-- 10 -->Reverts" },
]

# Protect breaking changes from being skipped due to `skip_tags`
protect_breaking_commits = true

# Filter commits by tags that match the given regex
tag_pattern = "v[0-9].*"

# Skip commits with these tags
skip_tags = "v0.1.0-beta.1"

# Sort the commits inside sections by the oldest or newest order
sort_commits = "newest"

# Limit the number of commits included in the changelog
# limit_commits = 42

[remote.github]
owner = "Balo-India2"
repo = "Balo-WebsiteV3"
