name: Changelog

on:
  push:
    branches:
      - develop

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    # Only run when commits are not from this bot (avoid infinite loops)
    if: "!contains(github.event.head_commit.message, 'chore(changelog): update CHANGELOG')"
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push CHANGELOG.md
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): update CHANGELOG [skip ci]"
          git push
